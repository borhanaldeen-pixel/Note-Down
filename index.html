<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#25121b">
<meta name="description" content="ملاحظات ذكية ثلاثية الأبعاد بتذكير وتسجيل صوتي">
<meta name="application-name" content="ملاحظاتي">
<link rel="manifest" href="manifest.json">
<title>ملاحظاتي الاحترافية</title>
<style>
:root{
  --bg-main: #f4f2fb;
  --panel: #311824;
  --line: #52273a;
  --accent: #ff477e;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:system-ui,sans-serif;}
html,body{height:100%; margin:0; background:#25121b; color:#fff; overflow-x:hidden;}
button,input,textarea,select{font:inherit; color:inherit;}

/* Header & UI */
.app{max-width:760px; margin:auto; padding:20px 15px 80px; position:relative;}
.header{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
.brand{background:var(--panel); padding:10px 20px; border-radius:20px; border:1px solid var(--line); font-weight:bold; font-size:18px;}
.mic-btn{width:100%; padding:20px; border-radius:20px; border:none; background:linear-gradient(135deg,#ff477e,#9b5de5); color:#fff; font-size:18px; font-weight:bold; cursor:pointer; box-shadow:0 10px 20px rgba(255,71,126,0.3); transition:0.3s;}
.mic-btn.rec{background:linear-gradient(135deg,#ff6b6b,#c92a2a); animation:pulse 1s infinite;}
@keyframes pulse{50%{transform:scale(0.97);}}

/* Controls */
.controls{display:flex; gap:10px; margin:20px 0;}
.controls button{flex:1; padding:12px; border-radius:15px; border:1px solid var(--line); background:var(--panel); font-weight:bold; cursor:pointer;}
.searchbar{width:100%; padding:15px; border-radius:15px; border:1px solid var(--line); background:var(--panel); margin-bottom:20px; outline:none;}

/* Grid & Note Cards */
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:15px;}
.note-card{
  border-radius:20px; padding:20px; position:relative;
  box-shadow:0 8px 16px rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.1);
  display:flex; flex-direction:column; gap:12px; transition:0.2s;
}
.note-card.pinned{border:2px solid #ffb703;}
.note-header{display:flex; justify-content:space-between; font-size:12px; opacity:0.8;}
.note-text{font-size:16px; line-height:1.6; white-space:pre-wrap; flex-grow:1;}
.reminder-badge{background:rgba(0,0,0,0.3); padding:5px 10px; border-radius:10px; font-size:12px; display:inline-block; border:1px dashed currentcolor;}
.actions{display:flex; gap:8px; justify-content:flex-end; border-top:1px solid rgba(0,0,0,0.1); padding-top:10px;}
.actions button{background:rgba(0,0,0,0.2); border:none; width:35px; height:35px; border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center;}

/* Modals */
.modal{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(5px); z-index:100; align-items:center; justify-content:center; padding:15px;}
.modal.show{display:flex;}
.box{background:var(--panel); width:100%; max-width:400px; padding:25px; border-radius:25px; border:1px solid var(--line); max-height:90vh; overflow-y:auto;}
.box h3{margin-top:0;}
.box label{display:block; margin:15px 0 5px; font-size:13px; color:#cba8b9;}
.box input[type="text"], .box input[type="datetime-local"], .box textarea{width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:#1a0d13; outline:none;}
.colors{display:flex; gap:10px; margin-bottom:15px;}
.colors input[type="color"]{width:40px; height:40px; border:none; border-radius:10px; cursor:pointer; background:none;}
.btn-row{display:flex; gap:10px; margin-top:20px;}
.btn-row button{flex:1; padding:12px; border-radius:12px; border:none; font-weight:bold; cursor:pointer;}
.btn-primary{background:var(--accent); color:#fff;}
.btn-secondary{background:#452232;}

/* Voice Wave */
.waves{display:flex; justify-content:center; gap:5px; height:50px; align-items:center;}
.waves span{width:6px; background:var(--accent); border-radius:3px; animation:wave 1s infinite ease-in-out;}
.waves span:nth-child(2){animation-delay:0.1s; background:#ffb703;}
.waves span:nth-child(3){animation-delay:0.2s; background:#06d6a0;}
.waves span:nth-child(4){animation-delay:0.3s; background:#00b4d8;}
@keyframes wave{0%,100%{height:10px;} 50%{height:40px;}}

.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#452232; padding:12px 20px; border-radius:20px; font-size:14px; z-index:200; display:none; box-shadow:0 10px 20px rgba(0,0,0,0.5);}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="brand">🗒️ ملاحظاتي (نسخة الأوفلاين)</div>
    <button class="actions button" onclick="openSettings()" style="background:var(--panel); padding:10px 15px; border-radius:15px; border:1px solid var(--line);">⚙️ الإعدادات</button>
  </div>

  <button id="micBtn" class="mic-btn" onclick="toggleVoiceNote()">🎙️ اضغط للتحدث (ملاحظة صوتية)</button>
  
  <div class="controls">
    <button onclick="openComposer()">✍️ ملاحظة نصية جديدة</button>
    <button onclick="requestNotificationPermission()">🔔 تفعيل التنبيهات</button>
  </div>

  <input type="text" id="search" class="searchbar" placeholder="ابحث في ملاحظاتك..." oninput="renderNotes()">

  <div class="grid" id="grid"></div>
</div>

<!-- Composer Modal -->
<div class="modal" id="composerModal">
  <div class="box">
    <h3 id="modalTitle">إضافة ملاحظة</h3>
    <label>نص الملاحظة</label>
    <textarea id="noteText" rows="4"></textarea>
    
    <div style="display:flex; gap:20px;">
      <div style="flex:1;">
        <label>لون الخلفية</label>
        <input type="color" id="bgColor" value="#311824">
      </div>
      <div style="flex:1;">
        <label>لون الخط</label>
        <input type="color" id="textColor" value="#ffffff">
      </div>
    </div>

    <label>تنبيه في وقت محدد (تذكير)</label>
    <input type="datetime-local" id="noteReminder">

    <div class="btn-row">
      <button class="btn-primary" onclick="saveNote()">حفظ</button>
      <button class="btn-secondary" onclick="closeModals()">إلغاء</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal" id="settingsModal">
  <div class="box">
    <h3>⚙️ إعدادات التنبيهات</h3>
    <p style="font-size:12px; color:#cba8b9;">اختر نغمة مخصصة من جهازك لتعمل وقت التذكير (سيتم حفظها محلياً).</p>
    
    <label>رفع نغمة (ملف صوتي):</label>
    <input type="file" id="audioUpload" accept="audio/*" style="font-size:13px;">
    
    <button onclick="testCustomAudio()" style="margin-top:10px; width:100%; padding:10px; border-radius:10px; background:#452232; border:none; cursor:pointer;">▶️ تجربة النغمة المحفوظة</button>

    <div class="btn-row">
      <button class="btn-primary" onclick="closeModals()">إغلاق</button>
    </div>
  </div>
</div>

<!-- Voice Modal -->
<div class="modal" id="voiceModal">
  <div class="box" style="text-align:center;">
    <h3>🎙️ جاري الاستماع...</h3>
    <div class="waves"><span></span><span></span><span></span><span></span></div>
    <p id="liveText" style="margin:20px 0; color:#cba8b9;">تحدث الآن باللغة العربية...</p>
    <div class="btn-row">
      <button class="btn-primary" onclick="stopVoiceNote()" style="background:#c92a2a;">⏹ إيقاف وحفظ</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* -------------------------------------------------------------------------- */
/* 1. قاعدة البيانات المحلية (IndexedDB) */
/* -------------------------------------------------------------------------- */
const DB_NAME = 'NotesOfflineDB';
let db;

function initDB() {
    const request = indexedDB.open(DB_NAME, 2);
    request.onupgradeneeded = (e) => {
        db = e.target.result;
        if (!db.objectStoreNames.contains('notes')) db.createObjectStore('notes', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
    };
    request.onsuccess = (e) => { 
        db = e.target.result; 
        renderNotes(); 
        startReminderChecker();
    };
}
initDB();

const toast = (msg) => {
    document.getElementById('toast').textContent = msg;
    document.getElementById('toast').style.display = 'block';
    setTimeout(() => document.getElementById('toast').style.display = 'none', 3000);
};

/* -------------------------------------------------------------------------- */
/* 2. إدارة الملاحظات */
/* -------------------------------------------------------------------------- */
let editingId = null;

function openComposer(note = null) {
    if (note && note.id) {
        editingId = note.id;
        document.getElementById('modalTitle').textContent = 'تعديل الملاحظة';
        document.getElementById('noteText').value = note.text;
        document.getElementById('bgColor').value = note.bgColor || '#311824';
        document.getElementById('textColor').value = note.textColor || '#ffffff';
        document.getElementById('noteReminder').value = note.reminderAt || '';
    } else {
        editingId = null;
        document.getElementById('modalTitle').textContent = 'ملاحظة جديدة';
        // لا نفرغ النص إذا كان قادماً من التسجيل الصوتي وتم وضعه مسبقاً
        if(!document.getElementById('noteText').value) {
            document.getElementById('noteText').value = '';
        }
        document.getElementById('bgColor').value = '#311824';
        document.getElementById('textColor').value = '#ffffff';
        document.getElementById('noteReminder').value = '';
    }
    document.getElementById('composerModal').classList.add('show');
}

function closeModals() {
    document.querySelectorAll('.modal').forEach(m => m.classList.remove('show'));
    document.getElementById('noteText').value = ''; // تفريغ بعد الإلغاء
}

function saveNote() {
    const text = document.getElementById('noteText').value.trim();
    if (!text) return toast('اكتب شيئاً!');

    const note = {
        id: editingId || Date.now().toString(),
        text: text,
        bgColor: document.getElementById('bgColor').value,
        textColor: document.getElementById('textColor').value,
        reminderAt: document.getElementById('noteReminder').value,
        pinned: editingId ? undefined : false,
        reminded: false
    };

    if (editingId) {
        const tx = db.transaction('notes', 'readonly');
        const req = tx.objectStore('notes').get(editingId);
        req.onsuccess = () => {
            const oldNote = req.result;
            note.pinned = oldNote.pinned;
            note.createdAt = oldNote.createdAt;
            saveToDB(note);
        }
    } else {
        note.createdAt = new Date().toISOString();
        saveToDB(note);
    }
}

function saveToDB(note) {
    const tx = db.transaction('notes', 'readwrite');
    tx.objectStore('notes').put(note);
    tx.oncomplete = () => {
        closeModals();
        renderNotes();
        scheduleBackgroundNotification(note);
        toast('تم الحفظ بنجاح');
    };
}

function deleteNote(id) {
    if(!confirm('حذف الملاحظة؟')) return;
    const tx = db.transaction('notes', 'readwrite');
    tx.objectStore('notes').delete(id);
    tx.oncomplete = () => { renderNotes(); toast('تم الحذف'); };
}

function togglePin(id) {
    const tx = db.transaction('notes', 'readwrite');
    const store = tx.objectStore('notes');
    store.get(id).onsuccess = (e) => {
        const note = e.target.result;
        note.pinned = !note.pinned;
        store.put(note).onsuccess = () => renderNotes();
    };
}

function renderNotes() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    const tx = db.transaction('notes', 'readonly');
    const req = tx.objectStore('notes').getAll();
    req.onsuccess = () => {
        let notes = req.result;
        notes = notes.filter(n => n.text.toLowerCase().includes(q));
        notes.sort((a,b) => (b.pinned - a.pinned) || (new Date(b.createdAt) - new Date(a.createdAt)));
        
        const grid = document.getElementById('grid');
        grid.innerHTML = notes.map(n => `
            <div class="note-card ${n.pinned ? 'pinned' : ''}" style="background:${n.bgColor}; color:${n.textColor}">
                <div class="note-header">
                    <span>${new Date(n.createdAt).toLocaleDateString()}</span>
                    ${n.pinned ? '📌' : ''}
                </div>
                <div class="note-text">${n.text}</div>
                ${n.reminderAt ? `<div class="reminder-badge">⏰ ${new Date(n.reminderAt).toLocaleString()}</div>` : ''}
                
                <div class="actions">
                    <button onclick='speakText(\`${n.text}\`)' title="قراءة">🔊</button>
                    <button onclick='copyText(\`${n.text}\`)' title="نسخ">📋</button>
                    <button onclick="togglePin('${n.id}')" title="تثبيت">📌</button>
                    <button onclick='openComposer(${JSON.stringify(n).replace(/'/g, "\\'")})' title="تعديل">✏️</button>
                    <button onclick="deleteNote('${n.id}')" title="حذف" style="background:rgba(200,0,0,0.3)">🗑️</button>
                </div>
            </div>
        `).join('') || '<div style="text-align:center; color:#888; grid-column:1/-1;">لا توجد ملاحظات</div>';
    };
}

function copyText(text) {
    navigator.clipboard.writeText(text);
    toast('تم النسخ للحافظة');
}

/* -------------------------------------------------------------------------- */
/* 3. الإعدادات والتنبيهات */
/* -------------------------------------------------------------------------- */
function openSettings() { document.getElementById('settingsModal').classList.add('show'); }

document.getElementById('audioUpload').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(event) {
        const base64Audio = event.target.result;
        const tx = db.transaction('settings', 'readwrite');
        tx.objectStore('settings').put({ key: 'customRingtone', data: base64Audio });
        tx.oncomplete = () => toast('✅ تم حفظ النغمة المخصصة بنجاح!');
    };
    reader.readAsDataURL(file);
});

function testCustomAudio() { playAlarm(); }

function playAlarm() {
    const tx = db.transaction('settings', 'readonly');
    const req = tx.objectStore('settings').get('customRingtone');
    req.onsuccess = () => {
        if (req.result && req.result.data) {
            const audio = new Audio(req.result.data);
            audio.play().catch(e => toast('يجب التفاعل مع الشاشة لتشغيل الصوت'));
        } else {
            playFallbackBeep();
        }
    };
}

function playFallbackBeep() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator();
        o.type = 'square'; o.frequency.value = 880;
        o.connect(ctx.destination);
        o.start(); o.stop(ctx.currentTime + 0.5);
    } catch(e) {}
}

async function requestNotificationPermission() {
    if ('Notification' in window) {
        const perm = await Notification.requestPermission();
        if (perm === 'granted') toast('تم تفعيل التنبيهات بنجاح');
        else toast('تم رفض التنبيهات من المتصفح');
    }
}

function startReminderChecker() {
    setInterval(() => {
        const now = new Date().getTime();
        const tx = db.transaction('notes', 'readwrite');
        const store = tx.objectStore('notes');
        store.getAll().onsuccess = (e) => {
            const notes = e.target.result;
            notes.forEach(note => {
                if (note.reminderAt && !note.reminded) {
                    const remTime = new Date(note.reminderAt).getTime();
                    if (now >= remTime) {
                        playAlarm();
                        if(Notification.permission === 'granted') {
                            try{ new Notification('⏰ تذكير بملاحظتك', { body: note.text }); }catch(err){}
                        }
                        note.reminded = true;
                        store.put(note);
                        toast('⏰ تذكير: ' + note.text);
                    }
                }
            });
        };
    }, 10000);
}

async function scheduleBackgroundNotification(note) {
    if (!note.reminderAt || Notification.permission !== 'granted') return;
    const remTime = new Date(note.reminderAt).getTime();
    if (remTime <= Date.now()) return;

    if ('serviceWorker' in navigator) {
        const reg = await navigator.serviceWorker.ready;
        if ('showTrigger' in Notification.prototype) {
            reg.showNotification('⏰ تذكير (ملاحظاتي)', {
                body: note.text,
                showTrigger: new TimestampTrigger(remTime),
                tag: 'rem-' + note.id
            }).catch(e => console.log('Trigger failed', e));
        }
    }
}

function speakText(txt) {
    if(!('speechSynthesis' in window)) return toast('جهازك لا يدعم القراءة الصوتية');
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'ar-SA';
    speechSynthesis.speak(u);
}

/* -------------------------------------------------------------------------- */
/* 4. محرك الصوت المعدّل جذرياً والمقاوم لأخطاء PWA والأندرويد */
/* -------------------------------------------------------------------------- */
let recognition = null;
let recActive = false;
let finalSpeechText = ''; // لتخزين النص الموثوق وعدم مسحه

function toggleVoiceNote() {
    if(recActive) { stopVoiceNote(); return; }
    
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR) return alert('متصفحك لا يدعم هذه الميزة. يرجى استخدام متصفح كروم.');

    // تصفير المتغيرات للبدء بنظافة تامة
    finalSpeechText = '';
    recActive = true;
    
    document.getElementById('voiceModal').classList.add('show');
    document.getElementById('liveText').textContent = 'تحدث الآن...';
    
    // بناء كائن جديد في كل ضغطة يمنع تجميد الجوال للميكروفون القديم
    recognition = new SR();
    recognition.lang = 'ar-SA';
    recognition.continuous = false; // نتركه false لكي لا يحظره الجوال بقوة
    recognition.interimResults = true;

    recognition.onresult = (e) => {
        let interim = '';
        let currentFinal = '';
        for(let i = e.resultIndex; i < e.results.length; i++){
            if(e.results[i].isFinal) currentFinal += e.results[i][0].transcript + ' ';
            else interim += e.results[i][0].transcript;
        }
        
        if(currentFinal) finalSpeechText += currentFinal;
        document.getElementById('liveText').textContent = finalSpeechText + interim;
    };

    recognition.onerror = (e) => {
        if(e.error === 'network') document.getElementById('liveText').textContent = '⚠️ تأكد من اتصال الإنترنت.';
        if(e.error === 'not-allowed') document.getElementById('liveText').textContent = '⚠️ يرجى إعطاء صلاحية الميكروفون.';
    };

    recognition.onend = () => {
        // إذا سكت المستخدم قليلاً وتوقف الميكروفون، نعيد تشغيله برفق بعد 300 ملي ثانية 
        // التأخير البسيط يمنع نظام الأندرويد من اعتبار التطبيق خبيثاً ويسمح بتشغيله مجدداً
        if(recActive) {
            setTimeout(() => {
                if(recActive && recognition) {
                    try { recognition.start(); } catch(err) {}
                }
            }, 300); 
        }
    };

    try { recognition.start(); } catch(e) {}
}

function stopVoiceNote() {
    recActive = false; // هذا يوقف دائرة onend نهائياً
    if(recognition) {
        try { recognition.stop(); } catch(e) {}
        recognition = null; // تفريغ الذاكرة
    }
    
    document.getElementById('voiceModal').classList.remove('show');
    
    // استخراج النص وتجاهل رسائل النظام
    let extractedText = document.getElementById('liveText').textContent;
    extractedText = extractedText.replace('تحدث الآن...', '').replace('⚠️ تأكد من اتصال الإنترنت.', '').trim();
    
    if(extractedText) {
        // نضع النص في حقل المحرر ونفتحه للمستخدم ليختار اللون ويحفظ
        document.getElementById('noteText').value = extractedText;
        openComposer(); 
    } else {
        toast('لم يتم التقاط أي نص');
    }
}

/* -------------------------------------------------------------------------- */
/* 5. Service Worker للتطبيق (PWA Offline) */
/* -------------------------------------------------------------------------- */
if ('serviceWorker' in navigator) {
    const swCode = `
        const CACHE = 'notes-offline-v2';
        self.addEventListener('install', e => {
            self.skipWaiting();
            e.waitUntil(caches.open(CACHE).then(c => c.addAll([location.href])));
        });
        self.addEventListener('fetch', e => {
            e.respondWith(caches.match(e.request).then(res => res || fetch(e.request)));
        });
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(()=>{});
}
</script>
</body>
</html>
