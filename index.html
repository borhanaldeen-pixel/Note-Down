<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a1520">
<meta name="description" content="ملاحظات ذكية ثلاثية الأبعاد بتذكير وتسجيل صوتي">
<meta name="application-name" content="ملاحظاتي">
<title>ملاحظاتي — بطاقات ثلاثية الأبعاد</title>
<style>
:root{
  --bg1: #25121b;
  --bg2: #381b28;
  --ink: #f4f2fb; 
  --ink-dim: #cba8b9;
  --panel: #311824;
  --panel-2: #3d1e2d;
  --line: #52273a;
  --accent-base: #ff477e;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
  color:var(--ink); min-height:100vh; overflow-x:hidden;
  background:
    radial-gradient(70% 50% at 15% 0%, rgba(255, 71, 126, 0.15) 0%, transparent 60%),
    radial-gradient(60% 45% at 100% 15%, rgba(255, 183, 3, 0.12) 0%, transparent 55%),
    radial-gradient(55% 50% at 90% 100%, rgba(155, 93, 229, 0.12) 0%, transparent 55%),
    linear-gradient(170deg, var(--bg1) 0%, var(--bg2) 100%);
  background-attachment:fixed;
}
button,input,textarea,select{font:inherit; color:inherit}
.blob{position:fixed; border-radius:50%; filter:blur(60px); opacity:.3; z-index:0; pointer-events:none}
.blob1{width:280px;height:280px;background:#ff477e;top:-80px;right:-60px;animation:float1 14s ease-in-out infinite}
.blob2{width:220px;height:220px;background:#ffb703;bottom:10%;left:-70px;animation:float2 16s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.blob{animation:none}}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,30px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(25px,-25px)}}

.app{max-width:760px;margin:auto;padding:18px 15px 60px;position:relative;z-index:1}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px}
.brand{display:flex;align-items:center;gap:12px;background:linear-gradient(145deg,var(--panel),var(--panel-2));padding:12px 18px;border-radius:20px;box-shadow:6px 6px 0 rgba(0,0,0,0.15), 0 14px 30px rgba(0,0,0,0.25);border:1px solid var(--line)}
.brand-emoji{font-size:26px}
.brand b{font-size:20px;font-weight:900;display:block;letter-spacing:-.3px}
.brand small{display:block;color:var(--ink-dim);font-size:11px;font-weight:700}
.header-actions{display:flex;gap:8px}
.icon-btn{width:46px;height:46px;border:0;border-radius:15px;background:linear-gradient(135deg,#ff477e,#9b5de5);color:#fff;font-size:20px;box-shadow:0 8px 18px rgba(255, 71, 126, 0.35);cursor:pointer}
.icon-btn.ghost{background:linear-gradient(135deg,var(--panel-2),var(--panel));box-shadow:none;border:1px solid var(--line)}
.icon-btn:active{transform:scale(0.94)}

.hero{background:linear-gradient(135deg,#671b39,#a82b49);border-radius:26px;padding:24px;box-shadow:8px 8px 0 rgba(0,0,0,0.2), 0 20px 45px rgba(103, 27, 57, 0.4);margin-bottom:20px;position:relative;overflow:hidden}
.hero h1{margin:0 0 5px;font-size:23px;font-weight:900}
.hero p{margin:0;opacity:.9;font-size:12.5px;line-height:1.6}
.mic-btn{width:100%;margin-top:18px;border:0;border-radius:20px;padding:20px 14px;background:#fff;color:#671b39;font-weight:900;font-size:18px;box-shadow:0 12px 25px rgba(0,0,0,0.25);cursor:pointer;position:relative;transition:.25s}
.mic-btn small{display:block;font-size:11.5px;color:#8a5a6b;margin-top:4px;font-weight:700}
.mic-btn.rec{background:linear-gradient(135deg,#ff6b6b,#c92a2a);color:#fff;animation:pulse 1.1s infinite}
.mic-btn.rec small{color:#ffe3e3}
@keyframes pulse{50%{transform:scale(.98); box-shadow:0 8px 20px rgba(255,60,60,.5)}}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.quick button{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:14px;box-shadow:5px 5px 0 rgba(0,0,0,0.15);cursor:pointer;font-weight:800;color:var(--ink)}
.quick button:active{transform:translateY(2px)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-align:center;box-shadow:4px 4px 0 rgba(0,0,0,0.1)}
.stat span{font-size:10.5px;color:var(--ink-dim);font-weight:700;display:block}
.stat b{display:block;font-size:18px;margin-top:4px}

.searchbar{width:100%;padding:13px 16px;border-radius:16px;border:1px solid var(--line);background:var(--panel);outline:0;margin-bottom:18px;font-weight:600;box-shadow:4px 4px 0 rgba(0,0,0,0.1)}
.searchbar::placeholder{color:var(--ink-dim)}
.searchbar:focus{border-color:#ff477e}

.grid{display:grid;grid-template-columns:1fr;gap:26px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}

.note-wrap{position:relative; perspective:700px; touch-action:pan-y}
.note-shadow{position:absolute; inset:0; background:var(--accent); border-radius:22px; transform:translate(9px, 10px) rotate(var(--tilt,-1.2deg)); z-index:0}
.note-card{position:relative; z-index:1; background:#1b0d14; border-radius:22px; padding:16px 16px 14px; border:1px solid rgba(255,255,255,0.08); transform:rotate(var(--tilt,-1.2deg)); box-shadow:0 4px 0 rgba(0,0,0,0.25), 0 18px 30px -8px rgba(0,0,0,.55), 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent); transition:transform .12s ease-out; cursor:grab;}
.note-card.pinned{outline:2px solid var(--accent)}
.note-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);flex-shrink:0}
.time{font-size:11px;color:var(--ink-dim);font-weight:700;}
.pin-flag{margin-right:auto;font-size:14px}
.note-text{margin:0 0 12px;font-size:15px;line-height:1.85;font-weight:600;white-space:pre-wrap;word-break:break-word}
.voice-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--accent);font-weight:800;margin-bottom:8px}
.reminder-chip{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;background:rgba(255,255,255,0.05);border:1px dashed var(--accent);border-radius:12px;padding:7px 10px;margin-bottom:10px;justify-content:center}
.note-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.note-actions button{border:0;background:rgba(255,255,255,0.08);color:var(--ink);width:36px;height:36px;border-radius:11px;font-size:15px;cursor:pointer}
.color-row{display:flex;gap:7px;margin-top:10px;margin-bottom:10px;flex-wrap:wrap}
.color-row span{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.color-row span.sel{border-color:#fff}
.empty{grid-column:1/-1;text-align:center;color:var(--ink-dim);padding:50px 20px;font-weight:700}
.empty b{display:block;font-size:34px;margin-bottom:8px}

.modal{display:none;position:fixed;inset:0;background:rgba(20, 10, 15, 0.75);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:18px;z-index:20}
.modal.show{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:22px;width:100%;max-width:460px;max-height:88vh;overflow:auto;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.box h2{margin:0 0 16px;font-size:18px;font-weight:900}
.box label{font-size:12px;color:var(--ink-dim);font-weight:800;display:block;margin:12px 0 6px}
.box textarea,.box input,.box select{width:100%;padding:13px;border:2px solid var(--line);border-radius:14px;outline:0;background:#25121b;color:var(--ink);font-weight:600;resize:vertical}
.row{display:flex;gap:10px;margin-top:18px}
.row button{flex:1;border:0;padding:13px;border-radius:14px;font-weight:800;cursor:pointer}
.primary{background:linear-gradient(135deg,#ff477e,#9b5de5);color:#fff;}
.secondary{background:#452232;color:var(--ink)}
.danger-btn{background:linear-gradient(135deg,#ff6b6b,#c92a2a);color:#fff}
.full-btn{width:100%;border:0;padding:13px;border-radius:14px;font-weight:800;cursor:pointer;margin-top:6px}
.voice-box{text-align:center}
.listening-waves{display:flex;justify-content:center;align-items:center;gap:6px;height:70px;margin-bottom:10px;background:#1a0d13;border-radius:14px;border:1px solid var(--line)}
.listening-waves span{width:8px;height:12px;border-radius:4px;animation:wave-anim 1.2s ease-in-out infinite}
.listening-waves span:nth-child(1){background:#ff477e;animation-delay:0.0s}
.listening-waves span:nth-child(2){background:#ffb703;animation-delay:0.1s}
.listening-waves span:nth-child(3){background:#06d6a0;animation-delay:0.2s}
.listening-waves span:nth-child(4){background:#9b5de5;animation-delay:0.3s}
.listening-waves span:nth-child(5){background:#00b4d8;animation-delay:0.4s}
@keyframes wave-anim{0%,100%{height:12px}50%{height:45px}}
.live-text{min-height:44px;font-weight:700;color:var(--ink-dim);font-size:13.5px}
.rec-timer{font-size:22px;font-weight:900;margin:6px 0;color:#ff477e}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#452232;border:1px solid var(--line);color:#fff;padding:13px 20px;border-radius:16px;display:none;z-index:40;font-size:13px;font-weight:700;}
</style>
</head>
<body>
<div class="blob blob1"></div><div class="blob blob2"></div>
<div class="app">
  <header class="header">
    <div class="brand"><span class="brand-emoji">🗒️</span><div><b>ملاحظاتي</b></div></div>
    <div class="header-actions">
      <button class="icon-btn" onclick="openComposer()">＋</button>
    </div>
  </header>

  <section class="hero">
    <h1>سجّل فكرتك بصوتك</h1>
    <button id="micBtn" class="mic-btn" onclick="toggleVoiceNote()">🎙️ ملاحظة صوتية جديدة</button>
  </section>

  <input class="searchbar" id="search" placeholder="ابحث في ملاحظاتك..." oninput="render()">
  <div class="grid" id="grid"></div>
</div>

<div class="modal" id="composerModal">
  <div class="box">
    <h2 id="composerTitle">✍️ ملاحظة جديدة</h2>
    <textarea id="composerText" rows="4" placeholder="اكتب هنا..."></textarea>
    <div class="color-row" id="composerColors"></div>
    <div class="row">
      <button class="primary" onclick="saveComposer()">حفظ</button>
      <button class="secondary" onclick="closeComposer()">إلغاء</button>
    </div>
  </div>
</div>

<div class="modal" id="voiceModal">
  <div class="box voice-box">
    <h2>🎙️ يستمع الآن...</h2>
    <div class="listening-waves"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="rec-timer" id="recTimer">00:00</div>
    <p class="live-text" id="liveText">جاري الاتصال بالميكروفون...</p>
    <div class="row">
      <button class="danger-btn" onclick="stopVoiceNote()">⏹ إيقاف وحفظ</button>
      <button class="secondary" onclick="cancelVoiceNote()">إلغاء</button>
    </div>
  </div>
</div>

<div class="modal" id="reviewModal">
  <div class="box">
    <h2>✅ راجع النص المستخرج</h2>
    <textarea id="reviewText" rows="4"></textarea>
    <div class="color-row" id="reviewColors"></div>
    <div class="row">
      <button class="primary" onclick="saveReview()">حفظ الملاحظة</button>
      <button class="secondary" onclick="discardReview()">إلغاء</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY='brilliantNotesV5'; 
const ACCENTS=['#ff477e','#ffb703','#06d6a0','#9b5de5','#00b4d8','#f15bb5']; 
let notes=JSON.parse(localStorage.getItem(KEY)||'[]');
const $=id=>document.getElementById(id);
const toast=t=>{$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)};
const save=()=>{localStorage.setItem(KEY,JSON.stringify(notes));render();};
const uid=()=>Date.now().toString();
function fmtTime(iso){const d=new Date(iso);return d.getDate()+'/'+(d.getMonth()+1)+' • '+d.getHours()+':'+d.getMinutes()}
function nextAccent(){return ACCENTS[notes.length%ACCENTS.length]}
function buildColorRow(container,selected,onPick){
  container.innerHTML='';
  ACCENTS.forEach(c=>{
    const s=document.createElement('span');
    s.style.background=c; if(c===selected)s.className='sel';
    s.onclick=()=>{[...container.children].forEach(x=>x.classList.remove('sel'));s.classList.add('sel');onPick(c)};
    container.appendChild(s);
  });
}

function render(){
  const q=$('search').value.trim().toLowerCase();
  const arr=notes.filter(n=>n.text.toLowerCase().includes(q)).sort((a,b)=>(b.pinned-a.pinned)||(new Date(b.createdAt)-new Date(a.createdAt)));
  $('grid').innerHTML=arr.length?arr.map(n=>{
    return `<div class="note-wrap" style="--accent:${n.color};--tilt:0deg" data-id="${n.id}">
      <div class="note-card ${n.pinned?'pinned':''}">
        <div class="note-top"><span class="dot"></span><span class="time">${fmtTime(n.createdAt)}</span></div>
        <p class="note-text">${n.text}</p>
        <div class="note-actions">
          <button class="danger" onclick="deleteNote('${n.id}')">🗑️</button>
        </div>
      </div>
    </div>`;
  }).join(''):'<div class="empty">لا توجد ملاحظات</div>';
}

let composerColor=null;
function openComposer(){
  $('composerText').value=''; composerColor=nextAccent();
  buildColorRow($('composerColors'),composerColor,c=>composerColor=c);
  $('composerModal').classList.add('show'); $('composerText').focus();
}
function closeComposer(){$('composerModal').classList.remove('show')}
function saveComposer(){
  const text=$('composerText').value.trim();
  if(!text)return toast('اكتب نص الملاحظة');
  notes.unshift({id:uid(),text,color:composerColor,createdAt:new Date().toISOString(),pinned:false});
  save(); closeComposer(); toast('تم الحفظ');
}
function deleteNote(id){
  notes=notes.filter(x=>x.id!==id); save(); toast('تم الحذف');
}

/* ---------------------------------------------------- */
/* النظام المعدل والمحسن بالكامل للتعرف على الصوت (العربية) */
/* ---------------------------------------------------- */
let recognition = null;
let recognitionShouldRun = false;
let recStartTime = 0, recTimerHandle = null, liveTranscript = '';

function toggleVoiceNote() {
  if (recognitionShouldRun) { stopVoiceNote(); return; }
  startVoiceNote();
}

function startVoiceNote() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  
  if (!SR) {
    alert('متصفحك لا يدعم هذه الميزة. يرجى فتح النظام باستخدام متصفح جوجل كروم (Google Chrome).');
    return;
  }
  
  if (window.location.protocol === 'file:') {
    alert('تنبيه هام: الميكروفون لا يعمل إذا تم فتح الملف محلياً (file://). يجب رفعه على استضافة أو تشغيله عبر Localhost.');
  }

  liveTranscript = '';
  recognitionShouldRun = true;
  recStartTime = Date.now();
  
  $('micBtn').classList.add('rec'); 
  $('micBtn').innerHTML = '⏹️ إيقاف التسجيل';
  $('voiceModal').classList.add('show'); 
  $('liveText').textContent = 'يتم الآن تهيئة الميكروفون...'; 
  $('recTimer').textContent = '00:00';
  
  recTimerHandle = setInterval(() => {
    const s = Math.floor((Date.now() - recStartTime) / 1000);
    $('recTimer').textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
  }, 1000);
  
  recognition = new SR();
  recognition.lang = 'ar-SA'; // اللغة العربية الافتراضية للتعرف الصوتي
  
  // حيلة لتجاوز مشاكل الأندرويد: جعل الاستمرار false وإعادة التشغيل عند التوقف
  recognition.continuous = false; 
  recognition.interimResults = true;
  
  recognition.onstart = () => {
    $('liveText').textContent = 'تحدث الآن (بالعربية)...';
  };

  recognition.onresult = e => {
    let interim = '';
    let finalChunk = '';
    
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalChunk += e.results[i][0].transcript + ' ';
      else interim += e.results[i][0].transcript;
    }
    
    if (finalChunk) liveTranscript += finalChunk;
    $('liveText').textContent = (liveTranscript + interim) || 'استمر في التحدث...';
  };
  
  recognition.onerror = e => {
    const msgs = {
      'not-allowed': 'تم رفض إذن الميكروفون. يجب السماح به من الإعدادات.',
      'audio-capture': 'الميكروفون محجوز لتطبيق آخر.',
      'network': 'لا يوجد اتصال بالإنترنت (مطلوب لتحويل الصوت).',
      'no-speech': 'توقف عن التحدث أو الصوت غير واضح.'
    };
    
    if (msgs[e.error]) $('liveText').textContent = msgs[e.error];
    
    // إيقاف المحاولة في الأخطاء التي تمنع التشغيل نهائياً
    if (e.error === 'not-allowed' || e.error === 'audio-capture') {
        recognitionShouldRun = false;
    }
  };
  
  recognition.onend = () => {
    // إذا توقف النظام لوحده (بسبب انتهاء الجملة)، نعيد تشغيله طالما لم يضغط المستخدم "إيقاف"
    if (recognitionShouldRun) { 
      setTimeout(() => {
          if (recognitionShouldRun) {
              try { recognition.start(); } catch(err) {} 
          }
      }, 300);
    }
  };
  
  try { recognition.start(); } catch(e) {}
}

function stopVoiceNote() {
  recognitionShouldRun = false;
  clearInterval(recTimerHandle);
  if (recognition) { try { recognition.abort(); } catch(e) {} }
  
  $('voiceModal').classList.remove('show');
  $('micBtn').classList.remove('rec'); 
  $('micBtn').innerHTML = '🎙️ ملاحظة صوتية جديدة';
  openReview();
}

function cancelVoiceNote() {
  recognitionShouldRun = false;
  clearInterval(recTimerHandle);
  if (recognition) { try { recognition.abort(); } catch(e) {} }
  
  $('voiceModal').classList.remove('show');
  $('micBtn').classList.remove('rec'); 
  $('micBtn').innerHTML = '🎙️ ملاحظة صوتية جديدة';
}

let reviewColor=null;
function openReview(){
  $('reviewText').value = liveTranscript.trim();
  reviewColor = nextAccent();
  buildColorRow($('reviewColors'), reviewColor, c=>reviewColor=c);
  $('reviewModal').classList.add('show');
}
function saveReview(){
  const text=$('reviewText').value.trim();
  if(!text){ toast('لا يوجد نص لحفظه!'); return; }
  notes.unshift({ id:uid(), text:text, color:reviewColor, createdAt:new Date().toISOString(), pinned:false });
  save(); $('reviewModal').classList.remove('show'); toast('تم حفظ الملاحظة');
}
function discardReview(){ $('reviewModal').classList.remove('show'); }

render();
</script>
</body>
</html>
