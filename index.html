<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#150f24">
<meta name="description" content="ملاحظات ذكية ثلاثية الأبعاد بتذكير وتسجيل صوتي">
<meta name="application-name" content="ملاحظاتي">
<link rel="manifest" href="./manifest.webmanifest" type="application/manifest+json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<title>ملاحظاتي — بطاقات ثلاثية الأبعاد</title>
<style>
:root{
  --bg1:#150f24; --bg2:#1f1836; --ink:#f4f2fb; --ink-dim:#a99fc9;
  --panel:#241b3d; --panel-2:#2c2149; --line:#3a2e5c;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
  color:var(--ink); min-height:100vh; overflow-x:hidden;
  background:
    radial-gradient(70% 50% at 15% 0%, rgba(155,93,229,0.20) 0%, transparent 60%),
    radial-gradient(60% 45% at 100% 15%, rgba(0,180,216,0.16) 0%, transparent 55%),
    radial-gradient(55% 50% at 90% 100%, rgba(255,107,107,0.14) 0%, transparent 55%),
    linear-gradient(170deg,var(--bg1) 0%, var(--bg2) 100%);
  background-attachment:fixed;
}
button,input,textarea{font:inherit; color:inherit}
.blob{position:fixed; border-radius:50%; filter:blur(60px); opacity:.35; z-index:0; pointer-events:none}
.blob1{width:280px;height:280px;background:#9b5de5;top:-80px;right:-60px;animation:float1 14s ease-in-out infinite}
.blob2{width:220px;height:220px;background:#00b4d8;bottom:10%;left:-70px;animation:float2 16s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.blob{animation:none}}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,30px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(25px,-25px)}}

.app{max-width:760px;margin:auto;padding:18px 15px 60px;position:relative;z-index:1}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px}
.brand{display:flex;align-items:center;gap:12px;background:linear-gradient(145deg,var(--panel),var(--panel-2));padding:12px 18px;border-radius:20px;box-shadow:6px 6px 0 rgba(155,93,229,0.18), 0 14px 30px rgba(0,0,0,0.35);border:1px solid var(--line)}
.brand-emoji{font-size:26px}
.brand b{font-size:20px;font-weight:900;display:block;letter-spacing:-.3px}
.brand small{display:block;color:var(--ink-dim);font-size:11px;font-weight:700}
.icon-btn{width:46px;height:46px;border:0;border-radius:15px;background:linear-gradient(135deg,#9b5de5,#6a2fbf);color:#fff;font-size:20px;box-shadow:0 8px 18px rgba(155,93,229,0.45);cursor:pointer}
.icon-btn:active{transform:scale(0.94)}

.hero{background:linear-gradient(135deg,#3a1a63,#6a2fbf 55%,#00728e);border-radius:26px;padding:24px;box-shadow:8px 8px 0 rgba(0,0,0,0.25), 0 20px 45px rgba(90,30,150,0.3);margin-bottom:20px;position:relative;overflow:hidden}
.hero h1{margin:0 0 5px;font-size:23px;font-weight:900}
.hero p{margin:0;opacity:.85;font-size:12.5px;line-height:1.6}
.mic-btn{width:100%;margin-top:18px;border:0;border-radius:20px;padding:20px 14px;background:#fff;color:#3a1a63;font-weight:900;font-size:18px;box-shadow:0 12px 25px rgba(0,0,0,0.25);cursor:pointer;position:relative;transition:.25s}
.mic-btn small{display:block;font-size:11.5px;color:#6b6082;margin-top:4px;font-weight:700}
.mic-btn.rec{background:linear-gradient(135deg,#ff6b6b,#c92a2a);color:#fff;animation:pulse 1.1s infinite}
.mic-btn.rec small{color:#ffe3e3}
@keyframes pulse{50%{transform:scale(.98); box-shadow:0 8px 20px rgba(255,60,60,.5)}}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.quick button{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:14px;box-shadow:5px 5px 0 rgba(0,0,0,0.2);cursor:pointer;font-weight:800;color:var(--ink)}
.quick button:active{transform:translateY(2px)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-align:center}
.stat span{font-size:10.5px;color:var(--ink-dim);font-weight:700;display:block}
.stat b{display:block;font-size:18px;margin-top:4px}

.searchbar{width:100%;padding:13px 16px;border-radius:16px;border:1px solid var(--line);background:var(--panel);outline:0;margin-bottom:18px;font-weight:600}
.searchbar::placeholder{color:var(--ink-dim)}
.searchbar:focus{border-color:#9b5de5}

.grid{display:grid;grid-template-columns:1fr;gap:26px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}

.note-wrap{position:relative; perspective:700px; touch-action:pan-y}
.note-shadow{position:absolute;inset:0;background:var(--accent);border-radius:22px;transform:translate(9px,10px) rotate(var(--tilt,-1.2deg));z-index:0}
.note-card{
  position:relative; z-index:1; background:#161029; border-radius:22px; padding:16px 16px 14px;
  border:1px solid rgba(255,255,255,0.06); transform:rotate(var(--tilt,-1.2deg));
  box-shadow:0 4px 0 rgba(0,0,0,0.25), 0 18px 30px -8px rgba(0,0,0,.55), 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent);
  transition:transform .12s ease-out; will-change:transform; cursor:grab;
}
.note-card.pinned{outline:2px solid var(--accent)}
.note-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);flex-shrink:0}
.time{font-size:11px;color:var(--ink-dim);font-weight:700;font-variant-numeric:tabular-nums}
.pin-flag{margin-right:auto;font-size:14px}
.note-text{margin:0 0 12px;font-size:15px;line-height:1.85;font-weight:600;white-space:pre-wrap;word-break:break-word}
.voice-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--accent);font-weight:800;margin-bottom:8px}
.audio-row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.04);border-radius:14px;padding:8px 10px;margin-bottom:10px}
.audio-row button{border:0;background:var(--accent);color:#160e28;width:32px;height:32px;border-radius:50%;font-size:14px;cursor:pointer;flex-shrink:0}
.audio-row .adur{font-size:11px;color:var(--ink-dim);font-weight:700}
.reminder-chip{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;background:rgba(255,255,255,0.05);border:1px dashed var(--accent);border-radius:12px;padding:7px 10px;margin-bottom:10px}
.reminder-chip.due{background:color-mix(in srgb, var(--accent) 25%, transparent); animation:glow 1s infinite alternate}
@keyframes glow{to{box-shadow:0 0 14px var(--accent)}}
.note-actions{display:flex;gap:6px;flex-wrap:wrap}
.note-actions button{border:0;background:rgba(255,255,255,0.06);color:var(--ink);width:34px;height:34px;border-radius:11px;font-size:14px;cursor:pointer}
.note-actions button:active{transform:scale(.9)}
.note-actions button.danger:active{background:#c92a2a}
.color-row{display:flex;gap:7px;margin-top:10px}
.color-row span{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.color-row span.sel{border-color:#fff}

.empty{grid-column:1/-1;text-align:center;color:var(--ink-dim);padding:50px 20px;font-weight:700}
.empty b{display:block;font-size:34px;margin-bottom:8px}

.modal{display:none;position:fixed;inset:0;background:rgba(10,7,20,0.72);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:18px;z-index:20}
.modal.show{display:flex}
.box{background:#1c1533;border:1px solid var(--line);border-radius:26px;padding:22px;width:100%;max-width:460px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.box h2{margin:0 0 16px;font-size:18px;font-weight:900}
.box label{font-size:12px;color:var(--ink-dim);font-weight:800;display:block;margin:12px 0 6px}
.box textarea,.box input{width:100%;padding:13px;border:2px solid var(--line);border-radius:14px;outline:0;background:#150f24;color:var(--ink);font-weight:600;resize:vertical}
.box textarea:focus,.box input:focus{border-color:#9b5de5}
.row{display:flex;gap:10px;margin-top:18px}
.row button{flex:1;border:0;padding:13px;border-radius:14px;font-weight:800;cursor:pointer}
.primary{background:linear-gradient(135deg,#9b5de5,#6a2fbf);color:#fff;box-shadow:0 8px 18px rgba(155,93,229,0.4)}
.secondary{background:#2c2149;color:var(--ink)}
.danger-btn{background:linear-gradient(135deg,#ff6b6b,#c92a2a);color:#fff}

.voice-box{text-align:center}
#wave{width:100%;height:70px;border-radius:14px;background:#0f0a1e;margin-bottom:10px}
.live-text{min-height:44px;font-weight:700;color:var(--ink-dim);font-size:13.5px}
.rec-timer{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;margin:6px 0}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2c2149;border:1px solid var(--line);color:#fff;padding:13px 20px;border-radius:16px;display:none;z-index:40;font-size:13px;font-weight:700;box-shadow:0 10px 25px rgba(0,0,0,.4)}
.offline-note{text-align:center;font-size:11px;color:var(--ink-dim);margin-top:14px;font-weight:700}
.particle{position:fixed;pointer-events:none;font-size:18px;z-index:50;animation:rise 900ms ease-out forwards}
@keyframes rise{to{transform:translateY(-90px) rotate(30deg);opacity:0}}
</style>
</head>
<body>
<div class="blob blob1"></div><div class="blob blob2"></div>
<div class="app">
  <header class="header">
    <div class="brand"><span class="brand-emoji">🗒️</span><div><b>ملاحظاتي</b><small>بطاقات ثلاثية الأبعاد • تعمل بدون إنترنت</small></div></div>
    <button class="icon-btn" onclick="openComposer()" aria-label="ملاحظة جديدة">＋</button>
  </header>

  <section class="hero">
    <h1>سجّل فكرتك بصوتك</h1>
    <p>اضغط وتحدث — تتحول كلماتك تلقائياً إلى ملاحظة داخل بطاقتها، مع الاحتفاظ بالتسجيل الأصلي.</p>
    <button id="micBtn" class="mic-btn" onclick="toggleVoiceNote()">🎙️ ملاحظة صوتية جديدة
      <small>اضغط للبدء، واضغط مجدداً للإيقاف</small>
    </button>
  </section>

  <div class="quick">
    <button id="installBtn" style="display:none" onclick="installApp()">📲 تثبيت التطبيق</button>
    <button onclick="openComposer()">✍️ ملاحظة نصية</button>
    <button onclick="requestNotifPerm()">🔔 تفعيل إشعارات التذكير</button>
    <button onclick="exportBackup()">⬇️ نسخة احتياطية</button>
  </div>

  <section class="stats">
    <div class="stat"><span>الملاحظات</span><b id="sTotal">0</b></div>
    <div class="stat"><span>تذكيرات مفعّلة</span><b id="sRem">0</b></div>
    <div class="stat"><span>مثبّتة 📌</span><b id="sPin">0</b></div>
  </section>

  <input class="searchbar" id="search" placeholder="ابحث في ملاحظاتك..." oninput="render()">

  <div class="grid" id="grid"></div>
  <p class="offline-note" id="offlineNote"></p>
  <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importBackup(event)">
</div>

<!-- إضافة/تعديل ملاحظة نصية -->
<div class="modal" id="composerModal">
  <div class="box">
    <h2 id="composerTitle">✍️ ملاحظة جديدة</h2>
    <label>نص الملاحظة</label>
    <textarea id="composerText" rows="4" placeholder="اكتب هنا..."></textarea>
    <label>لون البطاقة</label>
    <div class="color-row" id="composerColors"></div>
    <label>تذكير (اختياري)</label>
    <input type="datetime-local" id="composerReminder">
    <div class="row">
      <button class="primary" onclick="saveComposer()">حفظ</button>
      <button class="secondary" onclick="closeComposer()">إلغاء</button>
    </div>
  </div>
</div>

<!-- التسجيل الصوتي -->
<div class="modal" id="voiceModal">
  <div class="box voice-box">
    <h2>🎙️ يستمع الآن...</h2>
    <canvas id="wave" width="320" height="70"></canvas>
    <div class="rec-timer" id="recTimer">00:00</div>
    <p class="live-text" id="liveText">تحدث بوضوح...</p>
    <div class="row">
      <button class="danger-btn" onclick="stopVoiceNote()">⏹ إيقاف</button>
      <button class="secondary" onclick="cancelVoiceNote()">إلغاء</button>
    </div>
  </div>
</div>

<!-- مراجعة الملاحظة الصوتية قبل الحفظ -->
<div class="modal" id="reviewModal">
  <div class="box">
    <h2>✅ راجع ملاحظتك</h2>
    <div class="audio-row" id="reviewAudioRow" style="display:none">
      <button onclick="playReviewAudio()">▶️</button>
      <span class="adur" id="reviewDur"></span>
    </div>
    <label>النص (يمكنك تعديله)</label>
    <textarea id="reviewText" rows="4"></textarea>
    <label>لون البطاقة</label>
    <div class="color-row" id="reviewColors"></div>
    <label>تذكير (اختياري)</label>
    <input type="datetime-local" id="reviewReminder">
    <div class="row">
      <button class="primary" onclick="saveReview()">حفظ الملاحظة</button>
      <button class="secondary" onclick="discardReview()">حذف التسجيل</button>
    </div>
  </div>
</div>

<!-- ضبط تذكير سريع -->
<div class="modal" id="reminderModal">
  <div class="box">
    <h2>⏰ موعد التذكير</h2>
    <label>التاريخ والوقت</label>
    <input type="datetime-local" id="reminderInput">
    <div class="row">
      <button class="primary" onclick="saveReminder()">حفظ</button>
      <button class="secondary" onclick="clearReminder()">إزالة التذكير</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY='brilliantNotesV2';
const ACCENTS=['#ff6b6b','#ffb703','#06d6a0','#9b5de5','#00b4d8','#f15bb5'];
let notes=JSON.parse(localStorage.getItem(KEY)||'[]');
const $=id=>document.getElementById(id);
const toast=t=>{$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)};
const save=()=>{localStorage.setItem(KEY,JSON.stringify(notes));render()};
const uid=()=>Date.now().toString()+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
function fmtTime(iso){const d=new Date(iso);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' • '+pad(d.getHours())+':'+pad(d.getMinutes())}
function toLocalInput(iso){const d=iso?new Date(iso):new Date();const off=d.getTimezoneOffset();const l=new Date(d.getTime()-off*60000);return l.toISOString().slice(0,16)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function nextAccent(){return ACCENTS[notes.length%ACCENTS.length]}
function buildColorRow(container,selected,onPick){
  container.innerHTML='';
  ACCENTS.forEach(c=>{
    const s=document.createElement('span');
    s.style.background=c; if(c===selected)s.className='sel';
    s.onclick=()=>{[...container.children].forEach(x=>x.classList.remove('sel'));s.classList.add('sel');onPick(c)};
    container.appendChild(s);
  });
}

/* ---------- عرض البطاقات ---------- */
function render(){
  const q=$('search').value.trim().toLowerCase();
  const arr=notes.filter(n=>n.text.toLowerCase().includes(q)).sort((a,b)=>(b.pinned-a.pinned)||(new Date(b.createdAt)-new Date(a.createdAt)));
  $('grid').innerHTML=arr.length?arr.map(n=>{
    const tilt=(parseInt(n.id.slice(-2),36)%5-2)*0.6;
    const dueSoon = n.reminderAt && !n.reminded && new Date(n.reminderAt)<=new Date();
    return `<div class="note-wrap" style="--accent:${n.color};--tilt:${tilt}deg" data-id="${n.id}">
      <div class="note-shadow"></div>
      <div class="note-card ${n.pinned?'pinned':''}" data-id="${n.id}">
        <div class="note-top">
          <span class="dot"></span><span class="time">${fmtTime(n.createdAt)}</span>
          ${n.pinned?'<span class="pin-flag">📌</span>':''}
        </div>
        ${n.fromVoice?'<div class="voice-tag">🎙️ من تسجيل صوتي</div>':''}
        <p class="note-text">${esc(n.text)}</p>
        ${n.audio?`<div class="audio-row"><button onclick="playNoteAudio('${n.id}')">▶️</button><span class="adur">${n.audioDuration||''} ثانية</span></div>`:''}
        ${n.reminderAt?`<div class="reminder-chip ${dueSoon?'due':''}">⏰ ${fmtTime(n.reminderAt)} ${n.reminded?'• تم':''}</div>`:''}
        <div class="note-actions">
          <button title="قراءة صوتية" onclick="speakNote('${n.id}')">🔊</button>
          <button title="تثبيت" onclick="togglePin('${n.id}')">📌</button>
          <button title="تذكير" onclick="openReminder('${n.id}')">⏰</button>
          <button title="تعديل" onclick="editNote('${n.id}')">✏️</button>
          <button class="danger" title="حذف" onclick="deleteNote('${n.id}')">🗑️</button>
        </div>
      </div>
    </div>`;
  }).join(''):'<div class="empty"><b>📭</b>لا توجد ملاحظات بعد<br>اضغط ＋ أو استخدم الميكروفون</div>';

  $('sTotal').textContent=notes.length;
  $('sRem').textContent=notes.filter(n=>n.reminderAt && !n.reminded).length;
  $('sPin').textContent=notes.filter(n=>n.pinned).length;
  attachCardEffects();
}

/* ---------- إضافة / تعديل نصي ---------- */
let editingId=null, composerColor=null;
function openComposer(){
  editingId=null; $('composerTitle').textContent='✍️ ملاحظة جديدة';
  $('composerText').value=''; $('composerReminder').value='';
  composerColor=nextAccent();
  buildColorRow($('composerColors'),composerColor,c=>composerColor=c);
  $('composerModal').classList.add('show'); $('composerText').focus();
}
function editNote(id){
  const n=notes.find(x=>x.id===id); if(!n)return;
  editingId=id; $('composerTitle').textContent='✏️ تعديل الملاحظة';
  $('composerText').value=n.text; $('composerReminder').value=n.reminderAt?toLocalInput(n.reminderAt):'';
  composerColor=n.color;
  buildColorRow($('composerColors'),composerColor,c=>composerColor=c);
  $('composerModal').classList.add('show');
}
function closeComposer(){$('composerModal').classList.remove('show')}
function saveComposer(){
  const text=$('composerText').value.trim();
  if(!text)return toast('اكتب نص الملاحظة أولاً');
  const remVal=$('composerReminder').value;
  const reminderAt=remVal?new Date(remVal).toISOString():null;
  if(editingId){
    const n=notes.find(x=>x.id===editingId);
    n.text=text; n.color=composerColor;
    if(reminderAt!==n.reminderAt){n.reminderAt=reminderAt; n.reminded=false;}
  }else{
    notes.unshift({id:uid(),text,color:composerColor,createdAt:new Date().toISOString(),pinned:false,reminderAt,reminded:false,audio:null,audioDuration:null,fromVoice:false});
    burstConfetti();
  }
  save(); closeComposer(); toast('✅ تم الحفظ');
}
function togglePin(id){const n=notes.find(x=>x.id===id); n.pinned=!n.pinned; save();}
function deleteNote(id){
  const n=notes.find(x=>x.id===id); if(!n)return;
  if(!confirm('حذف هذه الملاحظة نهائياً؟'))return;
  notes=notes.filter(x=>x.id!==id); save(); toast('🗑️ تم الحذف');
}

/* ---------- تذكير ---------- */
let reminderTargetId=null;
function openReminder(id){
  reminderTargetId=id; const n=notes.find(x=>x.id===id);
  $('reminderInput').value=n.reminderAt?toLocalInput(n.reminderAt):toLocalInput();
  $('reminderModal').classList.add('show');
}
function saveReminder(){
  const n=notes.find(x=>x.id===reminderTargetId); if(!n)return;
  const v=$('reminderInput').value; if(!v)return toast('اختر تاريخاً ووقتاً');
  n.reminderAt=new Date(v).toISOString(); n.reminded=false;
  save(); $('reminderModal').classList.remove('show');
  requestNotifPerm(true); toast('⏰ تم ضبط التذكير');
}
function clearReminder(){
  const n=notes.find(x=>x.id===reminderTargetId); if(n){n.reminderAt=null;n.reminded=false;}
  save(); $('reminderModal').classList.remove('show'); toast('تم إلغاء التذكير');
}
function requestNotifPerm(silent){
  if(!('Notification' in window))return;
  if(Notification.permission==='default')Notification.requestPermission();
  else if(!silent) toast(Notification.permission==='granted'?'✅ الإشعارات مفعّلة':'الإشعارات غير مفعّلة من إعدادات المتصفح');
}
function beep(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=880; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.15,ctx.currentTime);
    o.start(); o.stop(ctx.currentTime+0.35);
  }catch(e){}
}
function checkReminders(){
  const now=new Date();
  let changed=false;
  notes.forEach(n=>{
    if(n.reminderAt && !n.reminded && new Date(n.reminderAt)<=now){
      n.reminded=true; changed=true;
      beep();
      try{ if('speechSynthesis' in window){
        const u=new SpeechSynthesisUtterance('تذكير: '+n.text);
        u.lang='ar-SA'; speechSynthesis.speak(u);
      }}catch(e){}
      if('Notification' in window && Notification.permission==='granted'){
        try{ new Notification('⏰ تذكير من ملاحظاتي',{body:n.text.slice(0,120)}); }catch(e){}
      }
      toast('⏰ تذكير: '+n.text.slice(0,40));
    }
  });
  if(changed) save();
}
setInterval(checkReminders,15000);

/* ---------- القراءة الصوتية لأي ملاحظة ---------- */
function speakNote(id){
  const n=notes.find(x=>x.id===id); if(!n)return;
  if(!('speechSynthesis' in window))return toast('المتصفح لا يدعم القراءة الصوتية');
  const u=new SpeechSynthesisUtterance(n.text); u.lang='ar-SA';
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
let currentAudioPlayer=null;
function playNoteAudio(id){
  const n=notes.find(x=>x.id===id); if(!n||!n.audio)return;
  if(currentAudioPlayer){currentAudioPlayer.pause();}
  currentAudioPlayer=new Audio(n.audio); currentAudioPlayer.play().catch(()=>toast('تعذر تشغيل التسجيل'));
}

/* ---------- تأثير الإمالة ثلاثية الأبعاد باللمس ---------- */
function attachCardEffects(){
  document.querySelectorAll('.note-card').forEach(card=>{
    const wrap=card.closest('.note-wrap');
    let sx=0, active=false;
    const tilt=(clientX,clientY)=>{
      const r=card.getBoundingClientRect();
      const px=(clientX-r.left)/r.width-0.5, py=(clientY-r.top)/r.height-0.5;
      card.style.transform=`rotate(${getComputedStyle(wrap).getPropertyValue('--tilt')||'0deg'}) perspective(600px) rotateX(${(-py*10).toFixed(2)}deg) rotateY(${(px*10).toFixed(2)}deg) scale(1.03)`;
    };
    const reset=()=>{card.style.transform='';};
    card.addEventListener('pointermove',e=>{ if(e.buttons===0 && e.pointerType==='mouse') tilt(e.clientX,e.clientY); });
    card.addEventListener('pointerleave',reset);
    card.addEventListener('touchstart',e=>{
      const t=e.touches[0]; sx=t.clientX; active=true; tilt(t.clientX,t.clientY);
    },{passive:true});
    card.addEventListener('touchmove',e=>{
      if(!active)return;
      const t=e.touches[0]; const dx=t.clientX-sx;
      wrap.style.transform=`translateX(${dx}px)`;
      tilt(t.clientX,t.clientY);
    },{passive:true});
    card.addEventListener('touchend',e=>{
      active=false; reset();
      const dx=parseFloat((wrap.style.transform.match(/-?\d+\.?\d*/)||[0])[0])||0;
      wrap.style.transform='';
      const id=wrap.dataset.id;
      if(dx<-90) deleteNote(id);
      else if(dx>90) togglePin(id);
    });
  });
}

/* ---------- الملاحظة الصوتية: تسجيل + تفريغ نصي ---------- */
let mediaRecorder=null, mediaChunks=[], mediaStream=null, recognition=null;
let recStartTime=0, recTimerHandle=null, liveTranscript='';
let audioCtx=null, analyser=null, waveHandle=null, reviewAudioData=null, reviewDurationSec=0;

async function toggleVoiceNote(){
  if(mediaRecorder && mediaRecorder.state==='recording'){ stopVoiceNote(); return; }
  await startVoiceNote();
}
async function startVoiceNote(){
  try{
    mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(e){ toast('يلزم إذن الميكروفون لتسجيل ملاحظة صوتية'); return; }
  mediaChunks=[]; liveTranscript='';
  mediaRecorder=new MediaRecorder(mediaStream);
  mediaRecorder.ondataavailable=e=>{ if(e.data.size>0) mediaChunks.push(e.data); };
  mediaRecorder.start();
  recStartTime=Date.now();
  $('micBtn').classList.add('rec'); $('micBtn').innerHTML='⏹️ إيقاف التسجيل<small>اضغط للإنهاء</small>';
  $('voiceModal').classList.add('show'); $('liveText').textContent='تحدث بوضوح...'; $('recTimer').textContent='00:00';
  recTimerHandle=setInterval(()=>{
    const s=Math.floor((Date.now()-recStartTime)/1000);
    $('recTimer').textContent=pad(Math.floor(s/60))+':'+pad(s%60);
  },300);
  setupWaveform(mediaStream);
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
    recognition=new SR(); recognition.lang='ar-YE'; recognition.continuous=true; recognition.interimResults=true;
    recognition.onresult=e=>{
      let interim='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) liveTranscript+=e.results[i][0].transcript+' ';
        else interim+=e.results[i][0].transcript;
      }
      $('liveText').textContent=(liveTranscript+interim)||'...';
    };
    recognition.onerror=()=>{ $('liveText').textContent='(تعذّر التفريغ النصي — يمكنك كتابة النص يدوياً بعد الحفظ، يحتاج التفريغ اتصالاً بالإنترنت)'; };
    try{ recognition.start(); }catch(e){}
  }else{
    $('liveText').textContent='التفريغ النصي التلقائي غير مدعوم في هذا المتصفح — يمكنك كتابة النص يدوياً بعد الحفظ.';
  }
}
function setupWaveform(stream){
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const src=audioCtx.createMediaStreamSource(stream);
  analyser=audioCtx.createAnalyser(); analyser.fftSize=256;
  src.connect(analyser);
  const canvas=$('wave'), ctx=canvas.getContext('2d');
  const data=new Uint8Array(analyser.frequencyBinCount);
  function draw(){
    waveHandle=requestAnimationFrame(draw);
    analyser.getByteFrequencyData(data);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const barW=canvas.width/data.length;
    for(let i=0;i<data.length;i++){
      const h=(data[i]/255)*canvas.height;
      ctx.fillStyle=ACCENTS[i%ACCENTS.length];
      ctx.fillRect(i*barW, canvas.height-h, barW-1, h);
    }
  }
  draw();
}
function teardownWaveform(){
  if(waveHandle) cancelAnimationFrame(waveHandle);
  if(audioCtx){ audioCtx.close().catch(()=>{}); audioCtx=null; }
}
function stopVoiceNote(){
  if(!mediaRecorder) return;
  clearInterval(recTimerHandle);
  reviewDurationSec=Math.floor((Date.now()-recStartTime)/1000);
  const rec=mediaRecorder;
  rec.onstop=()=>{
    const blob=new Blob(mediaChunks,{type:'audio/webm'});
    const reader=new FileReader();
    reader.onload=()=>{
      reviewAudioData=reader.result;
      openReview();
    };
    reader.readAsDataURL(blob);
  };
  rec.stop();
  mediaStream.getTracks().forEach(t=>t.stop());
  if(recognition){ try{recognition.stop();}catch(e){} }
  teardownWaveform();
  $('voiceModal').classList.remove('show');
  $('micBtn').classList.remove('rec'); $('micBtn').innerHTML='🎙️ ملاحظة صوتية جديدة<small>اضغط للبدء، واضغط مجدداً للإيقاف</small>';
  mediaRecorder=null;
}
function cancelVoiceNote(){
  if(mediaRecorder && mediaRecorder.state==='recording'){
    mediaRecorder.onstop=()=>{};
    mediaRecorder.stop();
    mediaStream.getTracks().forEach(t=>t.stop());
  }
  if(recognition){ try{recognition.stop();}catch(e){} }
  clearInterval(recTimerHandle); teardownWaveform();
  $('voiceModal').classList.remove('show');
  $('micBtn').classList.remove('rec'); $('micBtn').innerHTML='🎙️ ملاحظة صوتية جديدة<small>اضغط للبدء، واضغط مجدداً للإيقاف</small>';
  mediaRecorder=null;
}
let reviewColor=null;
function openReview(){
  $('reviewText').value=liveTranscript.trim();
  $('reviewReminder').value='';
  reviewColor=nextAccent();
  buildColorRow($('reviewColors'),reviewColor,c=>reviewColor=c);
  $('reviewDur').textContent=reviewDurationSec+' ثانية';
  $('reviewAudioRow').style.display='flex';
  $('reviewModal').classList.add('show');
}
function playReviewAudio(){
  if(!reviewAudioData)return;
  new Audio(reviewAudioData).play().catch(()=>toast('تعذر التشغيل'));
}
function saveReview(){
  const text=$('reviewText').value.trim()||'ملاحظة صوتية بدون نص';
  const remVal=$('reviewReminder').value;
  notes.unshift({
    id:uid(), text, color:reviewColor, createdAt:new Date().toISOString(),
    pinned:false, reminderAt:remVal?new Date(remVal).toISOString():null, reminded:false,
    audio:reviewAudioData, audioDuration:reviewDurationSec, fromVoice:true
  });
  reviewAudioData=null;
  save(); $('reviewModal').classList.remove('show'); burstConfetti(); toast('✅ تم حفظ الملاحظة الصوتية');
}
function discardReview(){
  reviewAudioData=null; $('reviewModal').classList.remove('show'); toast('تم تجاهل التسجيل');
}

/* ---------- نسخ احتياطي ---------- */
function exportBackup(){
  const blob=new Blob([JSON.stringify(notes,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='ملاحظاتي-نسخة-احتياطية.json'; a.click();
  toast('⬇️ تم تنزيل النسخة الاحتياطية');
}
function importBackup(e){
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!Array.isArray(data)) throw 0;
      notes=data.concat(notes); save(); toast('✅ تم استيراد الملاحظات');
    }catch(e){ toast('ملف غير صالح'); }
  };
  reader.readAsText(file);
  e.target.value='';
}

/* ---------- لمسة احتفالية بسيطة ---------- */
function burstConfetti(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const icons=['✨','🎉','💫','⭐'];
  for(let i=0;i<5;i++){
    const s=document.createElement('span'); s.className='particle'; s.textContent=icons[i%icons.length];
    s.style.left=(45+Math.random()*10)+'vw'; s.style.bottom='20vh';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),950);
  }
}

/* ---------- حالة الاتصال، تركيب، تشغيل ---------- */
function updateOnlineStatus(){
  $('offlineNote').textContent = navigator.onLine
    ? 'التطبيق يعمل ويحفظ محلياً على جهازك — التفريغ الصوتي فقط يحتاج إنترنت'
    : '📴 وضع عدم الاتصال — كل شيء يعمل من جهازك ما عدا تفريغ الصوت لنص';
}
window.addEventListener('online',updateOnlineStatus);
window.addEventListener('offline',updateOnlineStatus);
updateOnlineStatus();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{}));
}
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredInstallPrompt=e; $('installBtn').style.display='block';
});
async function installApp(){
  if(!deferredInstallPrompt){ toast('افتح قائمة المتصفح واختر «إضافة إلى الشاشة الرئيسية»'); return; }
  deferredInstallPrompt.prompt(); await deferredInstallPrompt.userChoice; deferredInstallPrompt=null;
  $('installBtn').style.display='none';
}
window.addEventListener('appinstalled',()=>{ $('installBtn').style.display='none'; toast('✅ تم تثبيت التطبيق'); });

render();
</script>
